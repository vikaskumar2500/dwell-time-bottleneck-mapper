[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dwell-time-bottleneck-mapper"
version = "0.2.0"
description = "Privacy-aware spatial analytics for retail camera feeds"
requires-python = ">=3.9"

[project.scripts]
dwell-map = "dwell_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

