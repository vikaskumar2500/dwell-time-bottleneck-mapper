name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: dwell-map validate-config config/store.sample.json
      - run: dwell-map generate-demo --output /tmp/dwell-tracks.jsonl
      - run: dwell-map analyze --input /tmp/dwell-tracks.jsonl --output /tmp/dwell-report
      - run: dwell-map evaluate --report /tmp/dwell-report/report.json --output /tmp/dwell-evaluation.json
